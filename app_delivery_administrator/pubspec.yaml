name: app_delivery_administrator
description: "Runa Admin Panel — web administration for the DeliPuno delivery platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  intl: ^0.19.0
  cloud_functions: ^5.6.2
  firebase_storage: ^12.4.10
  image_picker: ^1.2.3
  image: ^4.1.7
  # Maps: real Google Maps for the location picker + live map (web target).
  # The web implementation is a separate federated plugin. The API key lives
  # only in web/index.html — never in Dart code.
  google_maps_flutter: ^2.17.1
  google_maps_flutter_web: ^0.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
